[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ksyco"
version = "0.1.0"
requires-python = ">=3.10"
# Pin exact versions of anything that can change what is sent to the API.
dependencies = ["anthropic==0.84.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Only for the factorial analysis (F distribution) and the figures; nothing here touches the API.
report = ["matplotlib>=3.8", "numpy>=1.26", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
